name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The rules of a game nobody has played before are the thing most
      # likely to be wrong, so they are checked directly: the gate, pips
      # under wraparound, hitting, the bar, and the forced-play rules.
      - name: Rule checks
        run: node test/rules.js

      # Every position of every game is audited for legality and checker
      # conservation, and the strength ladder has to hold from both seats.
      - name: Selfplay
        run: node test/selfplay.js 120 normal

      # The app is loaded as plain classic scripts, so a syntax error
      # would only surface in the browser. Parse each file to catch it here.
      - name: Parse browser sources
        run: |
          for f in js/*.js; do
            node --check "$f" || exit 1
          done
          echo "all sources parse"
